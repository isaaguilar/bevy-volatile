[package]
name = "volatile-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
volatile = { path = ".." }
volatile-online-protocol = { path = "../online-protocol" }

[dev-dependencies]
tokio-tungstenite = "0.29"
